[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brew-guard"
version = "0.1.0"
description = "Supply chain protection wrapper for Homebrew"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ricardo A. Krug", email = "ricardo@cena23.com.br" }]
keywords = ["homebrew", "security", "supply-chain", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/ricardoakrug/brew-guard"
Repository = "https://github.com/ricardoakrug/brew-guard"
Issues = "https://github.com/ricardoakrug/brew-guard/issues"

[project.scripts]
brew-guard = "brew_guard.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
